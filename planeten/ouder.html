<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d1f">
  <title>Ouderportaal</title>
  <link rel="icon" href="kunst/beeld/icoon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --achter: #0b0d1f; --kaart: #161a38; --kaart2: #1f2450; --tekst: #f4f2ff; --zacht: #a9a8c9;
      --goud: #ffd34d; --roze: #ff8fc8; --groen: #8be08b; --rood: #ff7a7a; --rand: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 50% -10%, #23275c 0%, var(--achter) 60%) fixed; color: var(--tekst); font-family: Fredoka, "Segoe UI", system-ui, sans-serif; font-size: 16px; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    header img { width: 52px; height: 52px; border-radius: 14px; }
    header h1 { margin: 0; font-size: 26px; flex: 1; }
    header small { display: block; color: var(--zacht); font-weight: 500; font-size: 14px; }
    .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: 20px; padding: 18px; margin-bottom: 16px; }
    h2 { margin: 0 0 6px; font-size: 20px; }
    p.uitleg { color: var(--zacht); margin: 0 0 14px; line-height: 1.45; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=email], input[type=password], select { width: 100%; font: inherit; color: var(--tekst); background: var(--kaart2); border: 1px solid var(--rand); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
    button { font: inherit; font-weight: 600; cursor: pointer; border: none; border-radius: 14px; min-height: 48px; padding: 0 18px; color: #221a00; background: linear-gradient(160deg, var(--goud), #ffb86b); }
    button.zacht { background: var(--kaart2); color: var(--tekst); border: 1px solid var(--rand); }
    button.gevaar { background: transparent; color: var(--rood); border: 1px solid rgba(255,122,122,0.4); }
    button:disabled { opacity: 0.5; cursor: default; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tabs button { flex: 1; }
    .tabs button.uit { background: var(--kaart2); color: var(--zacht); border: 1px solid var(--rand); }
    .fout { color: var(--rood); min-height: 22px; margin-top: 10px; }
    .rij { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .kind-kop { display: flex; align-items: center; gap: 10px; }
    .kind-kop input { font-size: 20px; font-weight: 700; }
    .instellingen { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
    @media (max-width: 560px) { .instellingen { grid-template-columns: 1fr; } }
    .teller { display: flex; align-items: center; gap: 8px; }
    .teller button { width: 48px; padding: 0; font-size: 22px; }
    .teller b { min-width: 34px; text-align: center; font-size: 20px; }
    .schakel { display: flex; align-items: center; gap: 10px; min-height: 48px; cursor: pointer; font-weight: 600; }
    .schakel input { width: 26px; height: 26px; accent-color: var(--goud); }
    .qr { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 12px; padding: 14px; background: var(--kaart2); border-radius: 16px; }
    .qr svg { width: 180px; height: 180px; background: #fff; border-radius: 12px; padding: 6px; flex: none; }
    .qr .qr-tekst { flex: 1; min-width: 200px; color: var(--zacht); line-height: 1.45; }
    .qr .qr-tekst b { color: var(--tekst); }
    .knoppen { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .melding { position: fixed; left: 16px; right: 16px; bottom: 20px; margin: 0 auto; width: fit-content; max-width: calc(100vw - 32px); background: #2a2f66; border: 1px solid var(--rand); padding: 12px 18px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    .melding[hidden] { display: none; }
    a { color: var(--goud); }
  </style>
</head>
<body>
  <main id="portaal">
    <header>
      <img src="kunst/beeld/icoon-192.png" alt="">
      <h1>Ouderportaal<small>Planeetmakers</small></h1>
      <button id="uitloggen" class="zacht" hidden>Uitloggen</button>
    </header>
    <div id="inhoud"></div>
  </main>
  <div id="melding" class="melding" hidden></div>
  <script type="module" src="./src/ouder.js"></script>
</body>
</html>
